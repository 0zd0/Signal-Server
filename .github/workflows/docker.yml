name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          distribution: 'temurin'
          java-version-file: .java-version
          cache: 'maven'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # 6.2.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get CodeArtifact Token
        id: get-token
        env:
          CA_DOMAIN: ${{ vars.CA_DOMAIN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --query authorizationToken \
            --output text)
          
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # 2.1.5

      - name: Build and push container image
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          ./mvnw -s settings.xml -B compile jib:build \
            -Pexclude-spam-filter \
            -pl service \
            -am \
            -Djib.to.image="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" \
            -Djib.to.tags="${{ github.ref_name }}"
